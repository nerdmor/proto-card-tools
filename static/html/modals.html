<!-- CONFIRM EMPTYING LIST MODAL -->
<div id="modal-empty-list" class="modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to empty your list?<br>This cannot be undone</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="modal-empty-list-confirm" type="button" class="btn btn-danger" disabled>Confirm</button>
            </div>
        </div>
    </div>
</div>
